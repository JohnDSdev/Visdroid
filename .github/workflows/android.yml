name: Android build and emulator smoke test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: visdroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visdroid-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm grant com.johndsdev.visdroid android.permission.RECORD_AUDIO
            adb shell am start -W -n com.johndsdev.visdroid/.CaptureLauncherActivity
            adb shell dumpsys activity activities | grep -q 'com.johndsdev.visdroid/.CaptureLauncherActivity'
            adb shell uiautomator dump /sdcard/visdroid-launcher.xml >/dev/null
            adb pull /sdcard/visdroid-launcher.xml /tmp/visdroid-launcher.xml >/dev/null
            python3 -c "import re,xml.etree.ElementTree as ET; root=ET.parse('/tmp/visdroid-launcher.xml').getroot(); nodes=[n for n in root.iter('node') if n.attrib.get('text')=='full-screen visualizer']; assert nodes, 'full-screen visualizer button not found'; nums=[int(v) for v in re.findall(r'\\d+', nodes[0].attrib['bounds'])]; print((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)" > /tmp/visdroid-fullscreen-tap.txt
            read X Y < /tmp/visdroid-fullscreen-tap.txt; adb shell input tap "$X" "$Y"
            sleep 1
            adb shell dumpsys activity activities | grep -q 'com.johndsdev.visdroid/.FullscreenVisualizerActivity'
            adb shell screencap -p /sdcard/visdroid-fullscreen.png
            adb pull /sdcard/visdroid-fullscreen.png visdroid-fullscreen.png
            adb shell input keyevent 4
            adb shell dumpsys package com.johndsdev.visdroid | grep -q 'VisDroidWallpaperService'
            adb shell am start -W -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.johndsdev.visdroid/.VisDroidWallpaperService
            sleep 3
            adb shell screencap -p /sdcard/visdroid-wallpaper-preview.png
            adb pull /sdcard/visdroid-wallpaper-preview.png visdroid-wallpaper-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-previews
          path: |
            visdroid-fullscreen.png
            visdroid-wallpaper-preview.png
          if-no-files-found: error
